name: macOS Catalina build

# Builds GoatTracker2.app for Intel Macs running macOS 10.15 Catalina or later
# with build_catalina.sh, checks that it doesn't depend on Homebrew and that
# every binary in it allows macOS 10.15, then uploads it as a zip artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Intel runner, so the x86_64 app's self-test runs natively.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Build GoatTracker2.app (x86_64, macOS 10.15+)
        run: bash build_catalina.sh

      - name: Verify the bundle runs on Catalina
        run: |
          set -euo pipefail
          app=GoatTracker2.app
          # minimum macOS of a Mach-O file (x86_64 slice)
          minos() {
            otool -arch x86_64 -l "$1" | awk '
              /LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX/ { f = 1 }
              f && !done && /^ *(minos|version) / { print $2; done = 1 }'
          }
          # true if version $1 <= 10.15
          le_1015() {
            awk -v v="$1" 'BEGIN { split(v, a, "."); exit !((a[1] < 10) || (a[1] == 10 && a[2] <= 15)) }'
          }
          status=0
          # app icon is bundled and named in Info.plist
          icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")"
          if [ -f "$app/Contents/Resources/$icon.icns" ] && file -b "$app/Contents/Resources/$icon.icns" | grep -q 'icon'; then
            echo "app icon: $icon.icns"
          else
            echo "::error::app icon $icon.icns missing from the bundle"; status=1
          fi
          # Info.plist is valid and declares the document types (Finder double-click)
          plutil -lint "$app/Contents/Info.plist" || status=1
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions:0' "$app/Contents/Info.plist" | grep -qx sng; then
            echo "document types: ok"
          else
            echo "::error::CFBundleDocumentTypes for .sng missing"; status=1
          fi
          # SDL2 is linked directly; sdl12-compat is gone
          if otool -L "$app/Contents/MacOS/goattrk2" | grep -q 'SDL2.framework'; then
            echo "goattrk2 links SDL2.framework"
          else
            echo "::error::goattrk2 does not link SDL2.framework"; status=1
          fi
          if [ -e "$app/Contents/Frameworks/libSDL-1.2.0.dylib" ]; then
            echo "::error::leftover sdl12-compat library in the bundle"; status=1
          fi
          # Interface fonts
          for font in Inter-Regular.ttf Inter-SemiBold.ttf JetBrainsMono-Regular.ttf; do
            [ -f "$app/Contents/Resources/fonts/$font" ] || { echo "::error::font $font missing"; status=1; }
          done
          while IFS= read -r f; do
            case "$(file -b "$f")" in *Mach-O*) ;; *) continue ;; esac
            lipo "$f" -verify_arch x86_64 || { echo "::error::$f has no x86_64 code"; status=1; continue; }
            v="$(minos "$f")"
            echo "$f: minimum macOS $v"
            le_1015 "$v" || { echo "::error::$f requires macOS $v"; status=1; }
            if otool -L "$f" | tail -n +2 | grep -E '/opt/homebrew|/usr/local|/opt/local'; then
              echo "::error::$f links a library outside the app bundle"; status=1
            fi
          done < <(find "$app" -type f)
          exit $status

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent GoatTracker2.app GoatTracker2-catalina-x86_64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: GoatTracker2-catalina-x86_64
          path: GoatTracker2-catalina-x86_64.zip
